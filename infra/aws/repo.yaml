AWSTemplateFormatVersion: "2010-09-09"
Description: SLC Document Tools - container registry for the backend Lambda image.

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: slc-doc-tools-backend
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        # Keep only the three most recent images to hold ECR storage cost near $0.
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 3 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: slc-doc-tools

Outputs:
  RepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
