AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SLC Document Tools on AWS - Lambda container backend (Function URL), DynamoDB
  job records, S3 file storage, and the static Next.js frontend on CloudFront.

Parameters:
  ImageUri:
    Type: String
    Description: Backend image in ECR, pinned by digest (repo@sha256:...).
  CertificateArn:
    Type: String
    Description: ACM certificate in us-east-1 for DomainName (from the cert stack).
  DomainName:
    Type: String
    Default: slc-document-formatter.imperial.imet.lk
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z0813279383BWQTTRAQUL
  MemorySize:
    Type: Number
    Default: 3008
  JobsRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      0 keeps job files and records forever (same as Railway). A positive value
      deletes jobs/ files and job records after that many days.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Optional address for monthly cost alerts at $1 and $2.

Conditions:
  HasRetention: !Not [!Equals [!Ref JobsRetentionDays, 0]]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub slc-doc-tools-data-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # Browser uploads of large request bodies (pre-signed PUT).
          - AllowedMethods: [PUT]
            AllowedOrigins:
              - !Sub https://${DomainName}
              - http://localhost:3000
            AllowedHeaders: ["*"]
            MaxAge: 3600
          # Large responses: fetch() follows the API's 303 redirect to a
          # pre-signed GET URL; after a cross-origin redirect the Origin is
          # "null", so GET must allow any origin (URLs are signed and expire).
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [Content-Disposition, Content-Type, Content-Length]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: transfer-copies-1-day
            Status: Enabled
            Prefix: transfer/
            ExpirationInDays: 1
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - !If
            - HasRetention
            - Id: job-files-retention
              Status: Enabled
              Prefix: jobs/
              ExpirationInDays: !Ref JobsRetentionDays
            - !Ref AWS::NoValue

  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: slc-doc-tools-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Only items stamped with expires_at (JOBS_RETENTION_DAYS > 0) expire.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: false # AWS-owned key encryption (default, free)

  # ---------------------------------------------------------------- backend
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/slc-doc-tools-backend
      RetentionInDays: 14

  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: slc-doc-tools-backend-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: backend-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${BackendLogGroup.Arn}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${DataBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slc-doc-tools/backend

  BackendFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: slc-doc-tools-backend
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      Timeout: 900
      EphemeralStorage:
        Size: 2048
      Role: !GetAtt BackendRole.Arn
      LoggingConfig:
        LogGroup: !Ref BackendLogGroup
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          JOBS_RETENTION_DAYS: !Ref JobsRetentionDays
          S3_BUCKET: !Ref DataBucket
          BODY_OFFLOAD_BUCKET: !Ref DataBucket
          SSM_PARAMETER_PATH: /slc-doc-tools/backend
          S3_ENV_PREFIX: config/env/
          ALLOWED_ORIGINS: !Sub https://${DomainName},http://localhost:3000

  BackendUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt BackendFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  BackendUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  BackendUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Keep one instance warm on weekdays during college hours (UK time) so
  # users rarely hit a cold start. ~2,600 tiny invocations/month (free tier).
  WarmerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: slc-doc-tools-warmer-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BackendFunction.Arn

  WarmerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: slc-doc-tools-keep-warm
      ScheduleExpression: cron(0/5 7-18 ? * MON-FRI *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt BackendFunction.Arn
        RoleArn: !GetAtt WarmerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0
        Input: >-
          {"version":"2.0","routeKey":"$default","rawPath":"/internal/warm","rawQueryString":"",
          "headers":{"host":"keep-warm","user-agent":"slc-keep-warm"},
          "requestContext":{"http":{"method":"GET","path":"/internal/warm","protocol":"HTTP/1.1",
          "sourceIp":"127.0.0.1","userAgent":"slc-keep-warm"},"requestId":"keep-warm",
          "routeKey":"$default","stage":"$default"},"isBase64Encoded":false}

  # ---------------------------------------------------------------- frontend
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub slc-doc-tools-site-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: slc-doc-tools-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SLC Document Tools frontend
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: slc-doc-tools

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  SiteDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone

  SiteDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---------------------------------------------------------------- cost guard
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: slc-doc-tools-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 2
          Unit: USD
        CostFilters:
          TagKeyValue:
            - user:Project$slc-doc-tools
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50 # $1
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100 # $2
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ApiUrl:
    Value: !GetAtt BackendUrl.FunctionUrl
  SiteUrl:
    Value: !Sub https://${DomainName}
  SiteBucketName:
    Value: !Ref SiteBucket
  DataBucketName:
    Value: !Ref DataBucket
  DistributionId:
    Value: !Ref SiteDistribution
  CloudFrontDomain:
    Value: !GetAtt SiteDistribution.DomainName
