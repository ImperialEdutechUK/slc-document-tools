<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Microsoft Garamond is an Office-licensed font and is not shipped in the
    application repository. On Linux, map the DOCX family name "Garamond" to
    EB Garamond so LibreOffice does not silently fall back to an unrelated
    serif font during PDF conversion.
  -->
  <alias binding="strong">
    <family>Garamond</family>
    <prefer>
      <family>EB Garamond</family>
    </prefer>
  </alias>

  <!-- Common Microsoft Office metric-compatible Linux fallbacks. -->
  <alias binding="strong">
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Calibri Light</family>
    <prefer>
      <family>Carlito</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Cambria</family>
    <prefer>
      <family>Caladea</family>
    </prefer>
  </alias>
</fontconfig>
